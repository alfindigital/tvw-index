  </g>
  <!-- Top layer with teal rim-light -->
  <g fill="none" stroke="#5eead4" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="32" cy="24" rx="18" ry="5.5"/>
