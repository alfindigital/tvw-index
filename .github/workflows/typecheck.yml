name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lockb', 'bun.lock', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript strict check
        id: tsc
        run: bunx tsc --noEmit --pretty

      - name: Unit tests
        id: test
        run: bunx vitest run

      - name: Production build
        id: build
        run: bunx vite build

      - name: Summary
        if: always()
        run: |
          {
            echo "### CI result"
            echo "- Typecheck: ${{ steps.tsc.outcome }}"
            echo "- Tests: ${{ steps.test.outcome }}"
            echo "- Build: ${{ steps.build.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"
